<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plateforme de feedback pour les étudiants de l'Institut de Génie Industriel.">
    <title>Enquête de Satisfaction Étudiante - ISGI GIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080b12; /* Deep Indigo Night */
            color: #f1f5f9; /* slate-100 */
        }
        .industrial-pattern {
            background-image: radial-gradient(rgba(99, 102, 241, 0.07) 1px, transparent 1px); 
            background-size: 32px 32px;
            background-attachment: fixed;
        }
        /* Gradient Background */
        .app-bg-gradient {
            background: radial-gradient(circle at 50% 0%, #0f172a 0%, #080b12 100%);
            min-height: 100vh;
        }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #080b12;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 3s infinite ease-in-out;
        }
        @keyframes subtle-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-subtle-shake {
            animation: subtle-shake 0.3s ease-in-out 2;
        }
        @keyframes progress-fill {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress-fill {
            animation: progress-fill 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0.1) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
        }
        @keyframes selection-glow {
          0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
          70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
          100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        .animate-selection-glow {
          animation: selection-glow 0.8s ease-out;
        }
        /* Scanline for QR Scanner */
        .scanline {
          position: absolute;
          width: 100%;
          height: 3px;
          background: #818cf8;
          box-shadow: 0 0 15px #818cf8, 0 0 5px white;
          top: 0;
          animation: scanner-move 3s infinite linear;
          z-index: 10;
        }
        @keyframes scanner-move {
          0% { top: 0; }
          100% { top: 100%; }
        }
        .line-clamp-2 {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vitest": "https://esm.sh/vitest@^4.0.16",
    "jsqr": "https://esm.sh/jsqr@1.4.0"
  }
}
</script>
</head>
<body class="app-bg-gradient">
    <div id="root"></div>
</body>
</html>
