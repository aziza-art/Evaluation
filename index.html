
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plateforme de feedback pour les étudiants de l'Institut de Génie Industriel.">
    <title>Enquête de Satisfaction Étudiante - IUP GIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080b12; /* Deep Indigo Night */
            color: #f1f5f9; /* slate-100 */
        }
        .industrial-pattern {
            background-image: radial-gradient(rgba(56, 189, 248, 0.1) 0.5px, transparent 0.5px); 
            background-size: 24px 24px;
            background-attachment: fixed;
        }
        /* Gradient Background */
        .app-bg-gradient {
            background: radial-gradient(circle at 50% 0%, #111827 0%, #080b12 100%);
        }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #080b12;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 3s infinite ease-in-out;
        }
        @keyframes subtle-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        .animate-subtle-shake {
            animation: subtle-shake 0.2s ease-in-out 2;
        }
        @keyframes progress-fill {
            0% { width: 0%; }
            10% { width: 5%; }
            30% { width: 25%; }
            60% { width: 65%; }
            90% { width: 95%; }
            100% { width: 100%; }
        }
        .animate-progress-fill {
            animation: progress-fill 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
        .bg-stripes {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
        }
        @keyframes slide-stripes {
            from { background-position: 0 0; }
            to { background-position: 40px 0; }
        }
        .animate-slide-stripes {
            animation: slide-stripes 1s linear infinite;
        }
        @keyframes scan {
          0% { transform: translateY(0); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(100%); opacity: 0; }
        }
        .animate-scan {
          animation: scan 2s linear infinite;
        }
        @keyframes bounce-x {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(10px); }
        }
        .animate-bounce-x {
          animation: bounce-x 1.2s infinite ease-in-out;
        }
        @keyframes pop {
          0% { transform: scale(1); }
          50% { transform: scale(1.02); }
          100% { transform: scale(1); }
        }
        .animate-pop {
          animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes selection-glow {
          0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
          70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
          100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .animate-selection-glow {
          animation: selection-glow 0.6s ease-out;
        }
        /* Scanline for QR Scanner */
        .scanline {
          position: absolute;
          width: 100%;
          height: 2px;
          background: #6366f1;
          box-shadow: 0 0 15px #6366f1;
          top: 0;
          animation: scanner-move 2.5s infinite linear;
        }
        @keyframes scanner-move {
          0% { top: 0; }
          50% { top: 100%; }
          100% { top: 0; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vitest": "https://esm.sh/vitest@^4.0.16",
    "jsqr": "https://esm.sh/jsqr@1.4.0"
  }
}
</script>
</head>
<body class="app-bg-gradient">
    <div id="root"></div>
</body>
</html>
